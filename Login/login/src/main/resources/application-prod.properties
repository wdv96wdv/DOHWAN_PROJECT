# 데이터 소스
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000    
spring.datasource.hikari.connection-timeout=30000 
spring.datasource.hikari.max-lifetime=1700000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.leakDetectionThreshold=10000


# postgresql PageHelper
pagehelper.helperDialect=postgresql

# Prepared Statement 캐싱 끄기
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false


# JPA 설정
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Open-In-View 비활성화로 요청 종료 시 영속성 컨텍스트/커넥션 정리
spring.jpa.open-in-view=false

